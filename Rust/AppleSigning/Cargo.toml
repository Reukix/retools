[package]
name = "retools-apple-signing"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "retools_apple_signing"
crate-type = ["staticlib"]

[dependencies]
isideload = { path = "../../Vendor/isideload", default-features = false, features = ["install", "tokio-mt"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "remote_pairing"] }
serde_json = "1"
plist = "1.8"
rootcause = "0.12"
base64 = "0.22"
libc = "0.2"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
